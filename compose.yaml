services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit_log"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data

  audit-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_log
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local-demo-only
    ports:
      - "8080:8080"

volumes:
  audit-postgres-data:
