
name: Java CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            details=$(grep -h -E "Tests run:|<<< FAILURE|<<< ERROR|Caused by:|Exception" target/surefire-reports/*.txt | head -c 50000)
            details=${details//'%'/'%25'}
            details=${details//$'\n'/'%0A'}
            details=${details//$'\r'/'%0D'}
            echo "::error file=pom.xml,title=Maven test failure::$details"
          fi

