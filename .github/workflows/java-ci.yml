name: Java CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run framework-independent unit tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CanonicalizerTest,HashChainTest,AuthorizationPolicyTest test
      - name: Run full test suite
        run: mvn --batch-mode --no-transfer-progress test
      - name: Repeat concurrency contract
        run: |
          for run in 1 2 3; do
            mvn --batch-mode --no-transfer-progress -Dtest=ConcurrentWriteIntegrationTest test
          done
      - name: Run clean tamper demonstration
        run: bash scripts/demo-tampering.sh
      - name: Capture synthetic query-plan baseline
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=QueryPlanBaselineIntegrationTest test
      - name: Upload query-plan baseline
        uses: actions/upload-artifact@v4
        with:
          name: query-plan-baseline
          path: target/performance-baseline/query-plans.txt
          if-no-files-found: error
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            details=$(cat target/surefire-reports/*.txt | tail -c 50000)
            details=${details//'%'/'%25'}
            details=${details//$'\n'/'%0A'}
            details=${details//$'\r'/'%0D'}
            echo "::error file=pom.xml,title=Maven test failure::$details"
          fi
